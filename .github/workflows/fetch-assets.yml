name: fetch-assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch:
    if: contains(github.event.head_commit.message, 'fetch-assets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p assets
          curl -sSL -o assets/cover-blame.png "https://aka.doubaocdn.com/s/sftPY6JzkF"
          curl -sSL -o assets/icon-blame.png "https://aka.doubaocdn.com/s/MV2Q7KspcQ"
          ls -l assets
      - name: commit
        run: |
          git config user.name "asset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "Add generated icon and cover [fetch-assets]"
          git push
